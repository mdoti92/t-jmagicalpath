<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧙 Laberinto Mágico</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      height: 100vh;
    }

    #game {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
    }

    .info-panel h3 {
      margin-bottom: 10px;
      color: #667eea;
    }

    .player-info {
      margin: 5px 0;
    }

    .connection-status {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border-radius: 4px;
      z-index: 1000;
    }

    .connection-status.connected {
      color: #4ade80;
    }

    .connection-status.disconnected {
      color: #ef4444;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-C0SZ6XMy.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
